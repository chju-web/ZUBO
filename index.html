
<script>
  const status = document.getElementById('status');

  window.addEventListener('ton-connect-ui-connection-error', event => {
    status.textContent =
      'UI ERROR: ' + JSON.stringify(event.detail);
  });

  window.addEventListener('ton-connect-connection-error', event => {
    status.textContent =
      'CONNECT ERROR: ' + JSON.stringify(event.detail);
  });

  window.addEventListener('unhandledrejection', event => {
    status.textContent =
      'JS ERROR: ' + String(event.reason);
  });

  const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
    manifestUrl:
      'https://chju-web.github.io/ZUBO/tonconnect-manifest.json',
    buttonRootId: 'ton-connect'
  });

  tonConnectUI.onStatusChange(wallet => {
    status.textContent = wallet
      ? 'CONNECTED: ' + wallet.account.address
      : 'NOT CONNECTED';
  });
</script>
